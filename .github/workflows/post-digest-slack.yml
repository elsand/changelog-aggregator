name: Post digest to Slack

on:
  workflow_call:
    inputs:
      digest_artifact_name:
        description: Artifact containing the Markdown digest.
        required: false
        default: claude-digest
        type: string
      artifact_run_id:
        description: Workflow run ID containing the digest artifact. Defaults to the current run.
        required: false
        default: ""
        type: string
      digest_file:
        description: Markdown digest file name.
        required: false
        default: digest.md
        type: string
    secrets:
      SLACK_BOT_TOKEN:
        required: true
      SLACK_CHANNEL_ID:
        required: true
  workflow_dispatch:
    inputs:
      digest_artifact_name:
        description: Artifact containing the Markdown digest.
        required: false
        default: claude-digest
        type: string
      artifact_run_id:
        description: Workflow run ID containing the digest artifact. Leave empty for the current run.
        required: false
        default: ""
        type: string
      digest_file:
        description: Markdown digest file name.
        required: false
        default: digest.md
        type: string

permissions:
  contents: read
  actions: read

jobs:
  post-slack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Download digest artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.digest_artifact_name }}
          run-id: ${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: .artifacts/digest

      - name: Post digest to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          python3 post_digest_slack.py \
            ".artifacts/digest/${{ inputs.digest_file }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
